services:
  rustfs:
    container_name: ddev-${DDEV_SITENAME}-rustfs
    image: rustfs/rustfs:1.0.0-rc.5
    hostname: ${DDEV_SITENAME}-rustfs
    # Configured by environment only. Keep it that way: CI runs this image as a plain
    # service container, which cannot pass command arguments.
    environment:
      RUSTFS_ACCESS_KEY: rustfsadmin
      RUSTFS_SECRET_KEY: rustfsadmin
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      # Every project hostname, deliberately: this is reached by port, not by a
      # hostname prefix, so the list expansion that trips prefixed services is fine here.
      VIRTUAL_HOST: $DDEV_HOSTNAME
      HTTP_EXPOSE: "8998:9000,8999:9001"
      HTTPS_EXPOSE: "9000:9000,9001:9001"
    volumes:
      - "rustfs:/data"
      - ".:/mnt/ddev_config"
      - ddev-global-cache:/mnt/ddev-global-cache
    expose:
      - "9000"
      - "9001"
    # Lets DDEV gate on readiness, so the post-start hook cannot race the daemon.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"
    x-ddev:
      describe-info: |
        User: rustfsadmin
        Pass: rustfsadmin
        API: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:9000
        Console: ${DDEV_PRIMARY_URL_WITHOUT_PORT}:9001

  # Runs the bucket post-start hook. The RustFS image ships no S3 client, so the tool
  # needs its own container. Idle otherwise.
  rustfs-cli:
    container_name: ddev-${DDEV_SITENAME}-rustfs-cli
    image: amazon/aws-cli:2.15.56
    hostname: ${DDEV_SITENAME}-rustfs-cli
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: rustfsadmin
      AWS_SECRET_ACCESS_KEY: rustfsadmin
      AWS_DEFAULT_REGION: auto
    entrypoint: ["/bin/sh", "-c", "sleep infinity"]
    volumes:
      - ".:/mnt/ddev_config"
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    restart: "no"

volumes:
  rustfs:
    name: ddev-${DDEV_SITENAME}-rustfs
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
