# Redis configuration for syoksheet.
#
# The `#ddev-generated` marker has been deliberately removed. While it is present
# the add-on owns this file and overwrites it on any add-on operation, which would
# silently revert everything below.
#
# These values mirror production exactly. Redis carries the queue here, not just
# the cache, and the difference between a correct and an incorrect eviction policy
# is a job that vanishes without an error.
#
# Reference: https://redis.io/docs/latest/operate/oss_and_stack/management/config-file/

maxmemory 2048mb

# volatile-lru evicts only keys that carry an expiry. Queued jobs have none, so
# they can never be dropped under memory pressure. `allkeys-*` policies can and
# will evict them.
#
# Eviction policy is per instance, not per database, so the cache/session/queue
# split across databases 1/2/3 does not on its own protect the queue. This does.
# The corollary is a project-wide rule: never use Cache::forever(), always set a
# TTL, or a cache key becomes ineligible for eviction and competes with the queue.
maxmemory-policy volatile-lru

# Append-only file, so the queue survives a container restart. Without this a
# `ddev restart` silently discards every queued job.
appendonly yes

# Flush the append-only file once per second. At most one second of writes is
# lost on a crash, at a fraction of the cost of `always`.
appendfsync everysec
