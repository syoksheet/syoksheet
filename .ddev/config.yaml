# DDEV configuration for syoksheet.
# Reference: https://docs.ddev.com/en/stable/users/configuration/config/
# Every service runs in DDEV. Never call php, composer, psql or npm on the host.

# Project identity
name: syoksheet
type: laravel
docroot: public

# Subdomains
# The application is one Laravel app serving four surfaces through Route::domain().
# Declaring all four here means those groups resolve locally exactly as in production,
# including cookie scoping, which is why local HTTPS (mkcert) matters too.
additional_hostnames:
  - api.syoksheet
  - app.syoksheet
  - admin.syoksheet
  - www.syoksheet
additional_fqdns: []
use_dns_when_possible: true

# Runtime
php_version: "8.4"
nodejs_version: "24"
webserver_type: nginx-fpm
composer_version: "2"
corepack_enable: false

# Xdebug stays off: leaving it enabled is a large, constant performance cost.
# Toggle it per session with `ddev xdebug` and `ddev xdebug off`.
xdebug_enabled: false

# Primary database
# The audit database (the `log` connection) is a SEPARATE Postgres instance,
# declared in .ddev/docker-compose.postgres-audit.yaml, mirroring the production
# split. Two databases, never two schemas: Postgres cannot join or foreign-key
# across databases, which is what enforces the audit log's "raw IDs, no
# cross-database FK constraints" rule.
database:
  type: postgres
  version: "18"

web_environment: []

# Startup hooks
# DDEV's Postgres instance always provisions a database named `db`, and that name
# cannot be configured. The application expects `syoksheet`, the same name used in
# staging and production, so it is created on every start rather than by hand:
# a database created manually would not survive `ddev delete`, and a fresh clone
# would come up broken.
#
# The SELECT guard exists because Postgres has no CREATE DATABASE IF NOT EXISTS,
# so an unguarded hook would fail on every start after the first. No GRANT is
# needed: the `db` role is a superuser and owns the database it creates. No
# connection flags are needed either, as PGHOST, PGUSER and PGPASSWORD are already
# set inside the web container.
hooks:
  post-start:
    - exec: psql -tAc "SELECT 1 FROM pg_database WHERE datname='syoksheet'" | grep -q 1 || psql -c 'CREATE DATABASE syoksheet OWNER db'
