# DDEV configuration for syoksheet: https://docs.ddev.com/en/stable/users/configuration/config/
# Every service runs in DDEV. Never call php, composer, psql or npm on the host.

# Project identity
name: syoksheet
type: laravel
docroot: public

# One Laravel app serves four surfaces through Route::domain(). Declaring all four
# makes those groups, and cookie scoping, resolve locally as they do in production.
additional_hostnames:
  - api.syoksheet
  - app.syoksheet
  - admin.syoksheet
  - www.syoksheet
additional_fqdns: []
use_dns_when_possible: true

# Runtime
php_version: "8.4"
nodejs_version: "24"
webserver_type: nginx-fpm
composer_version: "2"
corepack_enable: false

# Xdebug stays off: leaving it enabled is a large, constant performance cost.
# Toggle it per session with `ddev xdebug` and `ddev xdebug off`.
xdebug_enabled: false

# The audit database (the `log` connection) is a separate instance, declared in
# .ddev/docker-compose.postgres-audit.yaml. Two databases, never two schemas.
database:
  type: postgres
  version: "18"

web_environment: []

# Run on every start: doing either by hand would not survive `ddev delete`.
hooks:
  post-start:
    # DDEV always names its database `db`; the app expects `syoksheet`. The SELECT
    # guard stands in for the CREATE DATABASE IF NOT EXISTS that Postgres lacks.
    - exec: psql -tAc "SELECT 1 FROM pg_database WHERE datname='syoksheet'" | grep -q 1 || psql -c 'CREATE DATABASE syoksheet OWNER db'
    # `mc ready` waits because the minio image declares no HEALTHCHECK, so DDEV
    # cannot gate on it. `--ignore-existing` is mc's own idempotence.
    - exec: mc ready minio && mc mb --ignore-existing minio/syoksheet-public-local minio/syoksheet-private-local
      service: minio
