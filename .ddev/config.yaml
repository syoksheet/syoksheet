# DDEV configuration for syoksheet: https://docs.ddev.com/en/stable/users/configuration/config/
# Every service runs in DDEV. Never call php, composer, psql or npm on the host.

# Project identity
name: syoksheet
type: laravel
docroot: public

# One Laravel app serves four surfaces through Route::domain(). Three are declared
# here; the fourth is marketing, which lives on the project's bare hostname
# (syoksheet.ddev.site) exactly as it lives on the apex in production.
additional_hostnames:
  - api.syoksheet
  - app.syoksheet
  - admin.syoksheet
additional_fqdns: []
use_dns_when_possible: true

# Runtime
php_version: "8.4"
nodejs_version: "24"
webserver_type: nginx-fpm
composer_version: "2"
corepack_enable: false

# Xdebug stays off: leaving it enabled is a large, constant performance cost.
# Toggle it per session with `ddev xdebug` and `ddev xdebug off`.
xdebug_enabled: false

# One instance holds every database. The audit database (the `audit` connection) is a
# separate database, never a schema: Postgres cannot foreign-key across databases,
# which is what enforces the audit log's raw-ID rule.
database:
  type: postgres
  version: "18"

web_environment: []
web_extra_exposed_ports:
  - name: vite
    container_port: 5173
    http_port: 5172
    https_port: 5173

# DDEV's laravel project type rewrites DB_* and MAIL_* in `.env` on every start,
# pointing them at its own database and Mailpit. That silently reverts
# DB_DATABASE to `db` and MAIL_HOST to Mailpit, so `.env` is ours to manage.
disable_settings_management: true

# A failed hook must fail the start. Left unset it defaults to false, and DDEV
# reports success while the database or the buckets silently do not exist.
fail_on_hook_fail: true

# Both scripts run on every start and are idempotent. `.ddev` is mounted at
# /mnt/ddev_config in every container, and each script explains its own reasoning.
hooks:
  post-start:
    - exec: bash /mnt/ddev_config/scripts/create-databases.sh
    - exec: bash /mnt/ddev_config/scripts/create-buckets.sh
      service: rustfs-cli
