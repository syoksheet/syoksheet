<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Data table — syoksheet DS</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --amber-50:#fbf3e3;--amber-100:#f4e4be;--amber-700:#8a5e12;
    --clay-50:#fbefea;--clay-100:#f4d8cd;--clay-500:#cb5638;--clay-600:#b2412a;--clay-700:#8f3120;
    --bg:#fff;--surface:#fff;--border:var(--n-200);--border-2:var(--n-300);--hair:var(--n-150);
    --text:#141416;--text-2:var(--n-600);--text-3:var(--n-500);
    --radius-sm:5px;--radius:8px;--radius-lg:12px;--radius-xl:18px;
    --shadow-xs:0 1px 2px rgba(10,10,11,.05);--ring:rgba(0,64,64,.22);
    --fs:'Geist',system-ui,sans-serif;--fm:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--text);font-family:var(--fs);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--fm);font-size:11px;color:var(--text-3);}
  .dt{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;}
  .dt-toolbar{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--surface);flex-wrap:wrap;}
  .dt-search{position:relative;flex:1;min-width:160px;}
  .dt-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:14px;height:14px;stroke:var(--text-3);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .dt-search input{width:100%;height:32px;padding:0 10px 0 32px;font-family:var(--fs);font-size:13px;border:1px solid var(--border-2);border-radius:var(--radius);background:var(--surface);}
  .dt-btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 11px;font-size:12.5px;font-weight:500;color:var(--text-2);background:var(--surface);border:1px solid var(--border-2);border-radius:var(--radius);cursor:pointer;}
  .dt-btn svg{width:13px;height:13px;stroke:currentColor;stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .dt-bulk{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--border);background:var(--teal-50);font-size:12.5px;color:var(--teal-700);}
  .dt-bulk b{font-weight:600;}
  .dt-bulk .act{margin-left:auto;display:flex;gap:6px;}
  table.t{width:100%;border-collapse:separate;border-spacing:0;font-size:13.5px;}
  table.t thead th{text-align:left;font-family:var(--fm);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--text-3);font-weight:600;padding:10px 14px;background:var(--n-50);border-bottom:1px solid var(--border);white-space:nowrap;}
  table.t thead th.num{text-align:right;}
  table.t thead th.sortable{cursor:pointer;user-select:none;}
  table.t thead th .sort{display:inline-flex;align-items:center;gap:5px;}
  table.t thead th .sort svg{width:12px;height:12px;stroke:currentColor;stroke-width:2;fill:none;opacity:.4;}
  table.t thead th.asc .sort svg{opacity:1;color:var(--teal-600);}
  table.t tbody td{padding:11px 14px;border-bottom:1px solid var(--hair);vertical-align:middle;}
  table.t tbody tr:last-child td{border-bottom:none;}
  table.t tbody tr:hover{background:var(--n-50);}
  table.t tbody tr.sel{background:var(--teal-50);}
  table.t tbody tr.sel:hover{background:var(--teal-50);}
  td.num{text-align:right;font-family:var(--fm);font-size:12.5px;color:var(--text-2);}
  .ck{appearance:none;width:16px;height:16px;border:1.5px solid var(--n-400);border-radius:4px;background:var(--surface);cursor:pointer;position:relative;flex-shrink:0;}
  .ck:checked{background:var(--teal-600);border-color:var(--teal-600);}
  .ck:checked::after{content:"";position:absolute;top:2px;left:4.5px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg);}
  .who{display:flex;align-items:center;gap:9px;}
  .av{width:26px;height:26px;border-radius:999px;background:var(--teal-600);color:#fff;font-size:10px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;}
  .nm{font-weight:600;color:var(--text);}
  .role{display:inline-flex;padding:2px 9px;font-size:11.5px;font-weight:500;border-radius:999px;border:1px solid transparent;}
  .role.owner{background:linear-gradient(135deg,#312e81,#1d3a5f);color:#fff;}
  .role.manager{background:var(--teal-50);color:var(--teal-700);border-color:var(--teal-100);}
  .role.member{background:var(--n-50);color:var(--text-2);border-color:var(--border);}
  .dt-foot{display:flex;align-items:center;justify-content:space-between;padding:11px 14px;border-top:1px solid var(--border);background:var(--n-50);font-size:12.5px;color:var(--text-3);}
  .pager{display:inline-flex;gap:4px;}
  .pager button{width:28px;height:28px;border:1px solid var(--border-2);background:var(--surface);border-radius:6px;cursor:pointer;font-family:var(--fm);font-size:12px;color:var(--text-2);display:inline-flex;align-items:center;justify-content:center;}
  .pager button.on{background:var(--teal-600);color:#fff;border-color:var(--teal-600);}
  .pager button svg{width:13px;height:13px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
</style>
</head>
<body>
  <div class="dt">
    <div class="dt-toolbar">
      <div class="dt-search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><input placeholder="Search members…" /></div>
      <button class="dt-btn"><svg viewBox="0 0 24 24"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg> Role</button>
    </div>
    <div class="dt-bulk"><input class="ck" type="checkbox" checked /> <b>2 selected</b><div class="act"><button class="dt-btn">Change role</button><button class="dt-btn" style="color:var(--clay-600);border-color:var(--clay-100);">Remove</button></div></div>
    <table class="t">
      <thead><tr>
        <th style="width:36px;"><input class="ck" type="checkbox" /></th>
        <th class="sortable asc"><span class="sort">Member <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span></th>
        <th>Role</th>
        <th class="num sortable"><span class="sort">Brags <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></span></th>
      </tr></thead>
      <tbody>
        <tr class="sel"><td><input class="ck" type="checkbox" checked /></td><td><div class="who"><span class="av">PK</span><span class="nm">Priya Krishnan</span></div></td><td><span class="role owner">Owner</span></td><td class="num">9</td></tr>
        <tr class="sel"><td><input class="ck" type="checkbox" checked /></td><td><div class="who"><span class="av" style="background:#9a4a2f;">DC</span><span class="nm">David Chen</span></div></td><td><span class="role manager">Manager</span></td><td class="num">14</td></tr>
        <tr><td><input class="ck" type="checkbox" /></td><td><div class="who"><span class="av" style="background:#5b4a86;">MO</span><span class="nm">Mei Ono</span></div></td><td><span class="role member">Member</span></td><td class="num">7</td></tr>
      </tbody>
    </table>
    <div class="dt-foot"><span>1–3 of 47</span><div class="pager"><button><svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg></button><button class="on">1</button><button>2</button><button>3</button><button><svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg></button></div></div>
  </div>
  <span class="cap">search · filters · sortable headers · select-all + bulk bar · pagination</span>
</body>
</html>
