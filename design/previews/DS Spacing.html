<!-- @dsCard group="Foundations" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Spacing &amp; layout — syoksheet DS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-200:#93c7c5;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --color-canvas:#fff;--color-surface:#fff;--color-border:var(--n-200);--color-border-strong:var(--n-300);--color-border-subtle:var(--n-150);
    --color-text:#141416;--color-text-secondary:var(--n-600);--color-text-muted:var(--n-500);
    --radius-sm:5px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;
    --shadow-xs:0 1px 2px rgba(10,10,11,.05);
    --shadow-sm:0 1px 3px rgba(10,10,11,.07),0 1px 2px rgba(10,10,11,.04);
    --shadow-md:0 8px 22px -10px rgba(10,10,11,.16),0 2px 6px -3px rgba(10,10,11,.08);
    --shadow-lg:0 22px 48px -18px rgba(10,10,11,.22),0 6px 14px -8px rgba(10,10,11,.1);
    --font-sans:'Geist',system-ui,sans-serif;--font-mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--color-text);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);margin-bottom:8px;display:block;}
  .scale{display:flex;flex-direction:column;gap:2px;}
  .srow{display:grid;grid-template-columns:90px 1fr 64px;gap:16px;align-items:center;padding:7px 0;border-bottom:1px solid var(--color-border-subtle);}
  .srow:last-child{border-bottom:none;}
  .srow .tok{font-family:var(--font-mono);font-size:12px;color:var(--teal-700);}
  .srow .bar{height:15px;background:var(--teal-100);border:1px solid var(--teal-200);border-radius:3px;}
  .srow .px{font-family:var(--font-mono);font-size:11.5px;color:var(--color-text-muted);text-align:right;}
  .rg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .rcell{height:78px;background:var(--teal-50);border:1px solid var(--teal-200);display:flex;align-items:flex-end;justify-content:center;padding:8px;font-family:var(--font-mono);font-size:10.5px;color:var(--teal-700);}
  .eg{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .ecell{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-lg);height:90px;display:flex;align-items:flex-end;padding:12px;}
  .ecell .l{font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);}
  .ecell.xs{box-shadow:var(--shadow-xs);}.ecell.sm{box-shadow:var(--shadow-sm);}.ecell.md{box-shadow:var(--shadow-md);}.ecell.lg{box-shadow:var(--shadow-lg);}
</style>
</head>
<body>

  <div>
    <span class="cap">spacing scale · 8px base</span>
    <div class="scale">
      <div class="srow"><span class="tok">space-1</span><span class="bar" style="width:4px;"></span><span class="px">4px</span></div>
      <div class="srow"><span class="tok">space-2</span><span class="bar" style="width:8px;"></span><span class="px">8px</span></div>
      <div class="srow"><span class="tok">space-3</span><span class="bar" style="width:12px;"></span><span class="px">12px</span></div>
      <div class="srow"><span class="tok">space-4</span><span class="bar" style="width:16px;"></span><span class="px">16px</span></div>
      <div class="srow"><span class="tok">space-5</span><span class="bar" style="width:20px;"></span><span class="px">20px</span></div>
      <div class="srow"><span class="tok">space-6</span><span class="bar" style="width:24px;"></span><span class="px">24px</span></div>
      <div class="srow"><span class="tok">space-8</span><span class="bar" style="width:32px;"></span><span class="px">32px</span></div>
      <div class="srow"><span class="tok">space-12</span><span class="bar" style="width:48px;"></span><span class="px">48px</span></div>
      <div class="srow"><span class="tok">space-16</span><span class="bar" style="width:64px;"></span><span class="px">64px</span></div>
    </div>
  </div>

  <div>
    <span class="cap">corner radius</span>
    <div class="rg">
      <div class="rcell" style="border-radius:5px;">sm · 5</div>
      <div class="rcell" style="border-radius:8px;">base · 8</div>
      <div class="rcell" style="border-radius:12px;">lg · 12</div>
      <div class="rcell" style="border-radius:18px;">xl · 18</div>
    </div>
  </div>

  <div>
    <span class="cap">elevation</span>
    <div class="eg">
      <div class="ecell xs"><span class="l">xs · inputs, chips</span></div>
      <div class="ecell sm"><span class="l">sm · card hover</span></div>
      <div class="ecell md"><span class="l">md · popovers</span></div>
      <div class="ecell lg"><span class="l">lg · modals</span></div>
    </div>
  </div>

</body>
</html>
