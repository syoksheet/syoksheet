<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tooltip — syoksheet DS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --amber-50:#fbf3e3;--amber-100:#f4e4be;--amber-500:#d39a2a;--amber-600:#b07815;--amber-700:#8a5e12;
    --clay-50:#fbefea;--clay-100:#f4d8cd;--clay-500:#cb5638;--clay-600:#b2412a;--clay-700:#8f3120;
    --color-canvas:#fff;--color-surface:#fff;--color-border:var(--n-200);--color-border-strong:var(--n-300);--color-border-subtle:var(--n-150);
    --color-text:#141416;--color-text-secondary:var(--n-600);--color-text-muted:var(--n-500);
    --radius-sm:5px;--radius-md:8px;--radius-lg:12px;--shadow-xs:0 1px 2px rgba(10,10,11,.05);
    --font-sans:'Geist',system-ui,sans-serif;--font-mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--color-text);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);}
  .blk{display:flex;flex-direction:column;gap:14px;align-items:flex-start;}
  .row{display:flex;flex-wrap:wrap;gap:34px;align-items:flex-end;}

  .tt{display:inline-block;background:var(--n-900);color:#fff;font-size:12px;font-weight:500;line-height:1.45;padding:6px 10px;border-radius:var(--radius-sm);max-width:240px;box-shadow:0 4px 12px rgba(10,10,11,.18);}
  .tt .kbd{display:inline-block;font-family:var(--font-mono);font-size:10.5px;background:var(--n-700);border-radius:4px;padding:0 5px;margin-left:6px;}
  .demo{position:relative;display:inline-flex;flex-direction:column;align-items:center;gap:7px;}
  .demo .arrow{width:8px;height:8px;background:var(--n-900);transform:rotate(45deg);margin:-11px auto 0;}
  .demo.below{flex-direction:column-reverse;}
  .demo.below .arrow{transform:rotate(45deg);margin:0 auto -11px;}
  .icobtn{width:34px;height:34px;border-radius:var(--radius-md);border:1px solid var(--color-border);background:var(--color-surface);display:inline-flex;align-items:center;justify-content:center;color:var(--color-text-secondary);box-shadow:var(--shadow-xs);}
  .icobtn svg{width:16px;height:16px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .trunc{max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13.5px;border-bottom:1px dashed var(--n-300);}
  .place{display:grid;grid-template-columns:repeat(4,auto);gap:26px;align-items:end;}
  .place .cellcap{font-family:var(--font-mono);font-size:10.5px;color:var(--color-text-muted);text-align:center;margin-top:9px;}
</style>
</head>
<body>

  <div class="blk">
    <div class="cap">Icon-button label with shortcut · full value for truncated text</div>
    <div class="row">
      <span class="demo">
        <span class="tt">Copy verification link<span class="kbd">⌘C</span></span>
        <span class="arrow"></span>
        <button class="icobtn" aria-label="Copy verification link"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
      </span>
      <span class="demo">
        <span class="tt">hana.yusof@acmecorp.com</span>
        <span class="arrow"></span>
        <span class="trunc">hana.yusof@acmecorp…</span>
      </span>
    </div>
  </div>

  <div class="blk">
    <div class="cap">Placements · auto-flip when colliding with the viewport</div>
    <div class="place">
      <div><span class="demo"><span class="tt">Top</span><span class="arrow"></span><button class="icobtn" aria-label="Top example"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></span><div class="cellcap">top (default)</div></div>
      <div><span class="demo below"><span class="tt">Bottom</span><span class="arrow"></span><button class="icobtn" aria-label="Bottom example"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></span><div class="cellcap">bottom</div></div>
      <div style="display:flex;flex-direction:column;align-items:center;"><span style="display:inline-flex;align-items:center;gap:9px;"><span class="tt">Left</span><button class="icobtn" aria-label="Left example"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button></span><div class="cellcap">left</div></div>
      <div style="display:flex;flex-direction:column;align-items:center;"><span style="display:inline-flex;align-items:center;gap:9px;"><button class="icobtn" aria-label="Right example"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg></button><span class="tt">Right</span></span><div class="cellcap">right</div></div>
    </div>
  </div>

</body>
</html>
