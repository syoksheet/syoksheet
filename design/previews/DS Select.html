<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Select — syoksheet DS</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --clay-50:#fbefea;--clay-100:#f4d8cd;--clay-600:#b2412a;--clay-700:#8f3120;
    --color-canvas:#fff;--color-surface:#fff;--color-border:var(--n-200);--color-border-strong:var(--n-300);--color-border-subtle:var(--n-150);
    --color-text:#141416;--color-text-secondary:var(--n-600);--color-text-muted:var(--n-500);
    --radius-sm:5px;--radius-md:8px;--radius-lg:12px;--shadow-xs:0 1px 2px rgba(10,10,11,.05);
    --shadow-md:0 8px 22px -10px rgba(10,10,11,.16),0 2px 6px -3px rgba(10,10,11,.08);
    --font-sans:'Geist',system-ui,sans-serif;--font-mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--color-text);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);}
  .row{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start;}
  .demo{display:flex;flex-direction:column;gap:10px;align-items:flex-start;}
  .sel{appearance:none;-webkit-appearance:none;height:38px;width:220px;padding:0 36px 0 12px;font-family:var(--font-sans);font-size:14px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--color-border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-xs);cursor:pointer;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2371717a' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 12px center;}
  .sel:hover{border-color:var(--n-400);}
  .sel:focus{outline:none;border-color:var(--teal-500);box-shadow:0 0 0 3px rgba(0,64,64,.16);}
  .sel[disabled]{background-color:var(--n-50);color:var(--color-text-muted);cursor:not-allowed;}
  .ddwrap{position:relative;width:240px;}
  .ddbtn{height:38px;width:100%;padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:14px;color:var(--color-text);background:var(--color-surface);border:1px solid var(--teal-500);border-radius:var(--radius-md);box-shadow:0 0 0 3px rgba(0,64,64,.16);cursor:pointer;}
  .ddbtn svg{width:14px;height:14px;stroke:var(--color-text-muted);stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .ddmenu{margin-top:6px;width:100%;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--radius-md);box-shadow:var(--shadow-md);padding:5px;}
  .ddmenu .it{display:flex;align-items:center;gap:9px;padding:8px 10px;font-size:13.5px;border-radius:var(--radius-sm);cursor:pointer;color:var(--color-text);}
  .ddmenu .it:hover{background:var(--n-100);}
  .ddmenu .it.sel2{background:var(--teal-50);color:var(--teal-700);font-weight:600;}
  .ddmenu .it .ck{margin-left:auto;color:var(--teal-600);}
  .ddmenu .it .ck svg{width:14px;height:14px;stroke:currentColor;stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .ddmenu .srch{width:100%;height:30px;padding:0 10px;font-size:12.5px;border:1px solid var(--color-border);border-radius:var(--radius-sm);margin-bottom:5px;background:var(--n-50);}
  .field{display:flex;flex-direction:column;gap:7px;}
  .field .fl{font-size:13px;font-weight:600;}
</style>
</head>
<body>
  <div class="demo">
    <div class="row">
      <div class="field"><span class="fl">Re-check cadence</span>
        <select class="sel"><option>Every 24 hours</option><option>Every 12 hours</option><option>Every 6 hours</option></select>
      </div>
      <div class="field"><span class="fl">Disabled</span>
        <select class="sel" disabled><option>Locked</option></select>
      </div>
    </div>
    <span class="cap">native select · 38px tall · chevron right · disabled</span>
  </div>
  <div class="demo">
    <div class="ddwrap">
      <button class="ddbtn">Most recent <svg viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg></button>
      <div class="ddmenu">
        <input class="srch" placeholder="Filter…" />
        <div class="it sel2">Most recent <span class="ck"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span></div>
        <div class="it">Oldest first</div>
        <div class="it">Most verified</div>
        <div class="it">A–Z</div>
      </div>
    </div>
    <span class="cap">custom dropdown · open · search + selected check</span>
  </div>
</body>
</html>
