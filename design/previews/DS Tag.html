<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tag — syoksheet DS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --amber-50:#fbf3e3;--amber-100:#f4e4be;--amber-700:#8a5e12;
    --clay-50:#fbefea;--clay-100:#f4d8cd;--clay-500:#cb5638;--clay-600:#b2412a;--clay-700:#8f3120;
    --color-canvas:#fff;--color-surface:#fff;--color-border:var(--n-200);--color-border-strong:var(--n-300);--color-border-subtle:var(--n-150);
    --color-text:#141416;--color-text-secondary:var(--n-600);--color-text-muted:var(--n-500);
    --radius-sm:5px;--radius-md:8px;--radius-lg:12px;--radius-xl:18px;
    --shadow-xs:0 1px 2px rgba(10,10,11,.05);--color-focus-ring:rgba(0,64,64,.22);
    --font-sans:'Geist',system-ui,sans-serif;--font-mono:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--color-text);font-family:var(--font-sans);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--font-mono);font-size:11px;color:var(--color-text-muted);}
  .demo{display:flex;flex-direction:column;gap:10px;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}

  .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 11px;font-size:12.5px;font-weight:500;color:var(--teal-700);background:var(--teal-50);border:1px solid var(--teal-100);border-radius:999px;}
  .tag-soft{display:inline-flex;align-items:center;padding:4px 10px;color:var(--n-600);background:transparent;border:1px solid var(--color-border-strong);border-radius:999px;font-family:var(--font-mono);font-size:11.5px;}
  .tag-soft::before{content:"#";opacity:0.5;margin-right:1px;}
  .tag-filter{cursor:pointer;transition:all .12s ease;}
  .tag-filter:hover{border-color:var(--teal-200,#a8ccba);}
  .tag-filter.on{background:var(--teal-600);color:#fff;border-color:var(--teal-600);}
  .tag-input{display:inline-flex;align-items:center;gap:4px;padding:4px 4px 4px 11px;font-size:12.5px;font-weight:500;color:var(--teal-700);background:var(--teal-50);border:1px solid var(--teal-100);border-radius:999px;}
  .tag-input .x{width:15px;height:15px;border-radius:999px;background:rgba(0,64,64,.12);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
  .tag-input .x svg{width:8px;height:8px;stroke:var(--teal-700);stroke-width:2.5;fill:none;stroke-linecap:round;}
</style>
</head>
<body>

  <div class="demo">
    <div class="cap">Skill tags (teal, taxonomy) · keyword tags (mono, freeform, #-prefixed)</div>
    <div class="row">
      <span class="tag">PostgreSQL</span>
      <span class="tag">System Design</span>
      <span class="tag">Distributed Systems</span>
      <span class="tag-soft">migration</span>
      <span class="tag-soft">zero-downtime</span>
    </div>
  </div>

  <div class="demo">
    <div class="cap">Filter tags (one active) · input chip with remove</div>
    <div class="row">
      <span class="tag tag-filter on">PostgreSQL</span>
      <span class="tag tag-filter">Kubernetes</span>
      <span class="tag tag-filter">Observability</span>
      <span style="width:18px;"></span>
      <span class="tag-input">migration <span class="x"><svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></span>
    </div>
  </div>

</body>
</html>
