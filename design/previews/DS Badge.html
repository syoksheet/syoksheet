<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Badge — syoksheet DS</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --amber-50:#fbf3e3;--amber-100:#f4e4be;--amber-500:#d39a2a;--amber-700:#8a5e12;
    --clay-50:#fbefea;--clay-100:#f4d8cd;--clay-500:#cb5638;--clay-600:#b2412a;--clay-700:#8f3120;
    --bg:#fff;--surface:#fff;--border:var(--n-200);--border-2:var(--n-300);--hair:var(--n-150);
    --text:#141416;--text-2:var(--n-600);--text-3:var(--n-500);
    --radius-sm:5px;--radius:8px;--radius-lg:12px;--radius-xl:18px;
    --shadow-xs:0 1px 2px rgba(10,10,11,.05);
    --fs:'Geist',system-ui,sans-serif;--fm:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--text);font-family:var(--fs);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--fm);font-size:11px;color:var(--text-3);}
  .row{display:flex;flex-wrap:wrap;gap:14px;align-items:center;}
  .demo{display:flex;flex-direction:column;gap:12px;align-items:flex-start;}
  .badge{display:inline-flex;align-items:center;gap:6px;padding:3px 11px 3px 9px;font-family:var(--fm);font-size:11px;font-weight:500;letter-spacing:0.02em;line-height:1.5;border-radius:999px;border:1px solid transparent;}
  .badge svg{width:11px;height:11px;stroke:currentColor;stroke-width:2.25;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .badge-verified{background:var(--verify-50);color:var(--verify-700);border-color:var(--verify-100);font-weight:600;padding-left:6px;}
  .badge-verified .vm{width:13px;height:13px;background:var(--verify-600);color:#fff;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;}
  .badge-verified .vm svg{width:7px;height:7px;stroke:#fff;stroke-width:4;}
  .badge-pending{background:var(--amber-50);color:var(--amber-700);border-color:var(--amber-100);}
  .badge-unverified{background:var(--n-100);color:var(--n-600);border-color:var(--n-200);}
  .badge-info{background:var(--teal-50);color:var(--teal-700);border-color:var(--teal-100);}
  .badge-error{background:var(--clay-50);color:var(--clay-700);border-color:var(--clay-100);}
  .badge-count{background:var(--clay-600);color:#fff;font-weight:600;padding:1px 7px;min-width:20px;justify-content:center;}
</style>
</head>
<body>
  <div class="demo">
    <div class="row">
      <span class="badge badge-verified"><span class="vm"><svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg></span> Verified</span>
      <span class="badge badge-pending"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg> Pending</span>
      <span class="badge badge-unverified">Unverified</span>
      <span class="badge badge-info">Draft</span>
      <span class="badge badge-error">Disputed</span>
      <span class="badge badge-count">2</span>
    </div>
    <span class="cap">verified · pending · unverified · info · error · count</span>
  </div>
</body>
</html>
