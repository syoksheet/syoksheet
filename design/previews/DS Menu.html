<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Menu — syoksheet DS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --n-0:#fff;--n-50:#fafafa;--n-100:#f4f4f5;--n-150:#ededef;--n-200:#e5e5e8;--n-300:#d4d4d8;
    --n-400:#a1a1aa;--n-500:#71717a;--n-600:#52525b;--n-700:#3f3f46;--n-900:#161618;--n-950:#0a0a0b;
    --teal-50:#e9f3f2;--teal-100:#c9e4e2;--teal-500:#0d6360;--teal-600:#004040;--teal-700:#003131;
    --verify-50:#ecf4ef;--verify-100:#d0e7da;--verify-600:#157a5b;--verify-700:#0f5e46;
    --clay-50:#fbefea;--clay-100:#f4d8cd;--clay-600:#b2412a;--clay-700:#8f3120;
    --bg:#fff;--surface:#fff;--border:var(--n-200);--border-2:var(--n-300);--hair:var(--n-150);
    --text:#141416;--text-2:var(--n-600);--text-3:var(--n-500);
    --radius-sm:5px;--radius:8px;--radius-lg:12px;--shadow-xs:0 1px 2px rgba(10,10,11,.05);
    --shadow-md:0 8px 22px -10px rgba(10,10,11,.16),0 2px 6px -3px rgba(10,10,11,.08);
    --fs:'Geist',system-ui,sans-serif;--fm:'Geist Mono',ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:#fff;color:var(--text);font-family:var(--fs);font-size:15px;-webkit-font-smoothing:antialiased;padding:28px;display:flex;flex-direction:column;gap:22px;}
  .cap{font-family:var(--fm);font-size:11px;color:var(--text-3);margin-bottom:10px;display:block;}
  .stagegrp{display:flex;flex-wrap:wrap;gap:26px;align-items:flex-start;}
  .mtrig{width:30px;height:30px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text-3);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .mtrig svg{width:15px;height:15px;}
  .menu{width:200px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow-md);padding:6px;}
  .menu .mi{display:flex;align-items:center;gap:10px;padding:8px 10px;font-size:13px;color:var(--text);border-radius:var(--radius-sm);cursor:pointer;}
  .menu .mi:hover{background:var(--n-100);}
  .menu .mi svg{width:14px;height:14px;stroke:currentColor;stroke-width:1.85;fill:none;stroke-linecap:round;stroke-linejoin:round;color:var(--text-3);}
  .menu .mi.danger{color:var(--clay-600);}
  .menu .mi.danger:hover{background:var(--clay-50);}
  .menu .mi.danger svg{color:var(--clay-600);}
  .menu .msep{height:1px;background:var(--hair);margin:5px 0;}
  .menu .mlabel{font-family:var(--fm);font-size:9.5px;text-transform:uppercase;letter-spacing:0.07em;color:var(--text-3);padding:6px 10px 4px;}
</style>
</head>
<body>

  <div>
    <span class="cap">trigger · items (icon + label) · separator · destructive item last</span>
    <div class="stagegrp">
      <button class="mtrig"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="12" cy="19" r="1.6"/></svg></button>
      <div class="menu">
        <div class="mi"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> Edit</div>
        <div class="mi"><svg viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg> Open public wall</div>
        <div class="msep"></div>
        <div class="mi danger"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Leave organisation</div>
      </div>
      <div class="menu">
        <div class="mlabel">Organisation</div>
        <div class="mi"><svg viewBox="0 0 24 24"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z"/></svg> Edit details</div>
        <div class="mi"><svg viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg> Manage members</div>
      </div>
    </div>
  </div>

</body>
</html>
