name: Setup PHP
description: PHP 8.4 with a cached Composer install.

# The repository must already be checked out: a local action lives in the repo, so the
# job cannot reach this file before its own checkout step runs.

runs:
  using: composite
  steps:
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
      with:
        php-version: '8.4'
        coverage: none
        tools: composer:v2

    - name: Resolve the Composer cache directory
      id: composer-cache
      shell: bash
      run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
        # A partial hit still saves most of the download; the installation below reconciles
        # it against the lockfile.
        restore-keys: composer-${{ runner.os }}-

    - name: Install dependencies
      shell: bash
      run: composer install --no-interaction --prefer-dist --no-progress
