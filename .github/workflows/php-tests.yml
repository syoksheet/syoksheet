name: PHP tests

# The only PHP job needing services, so it is isolated: the fast gates in php-quality.yml
# report without waiting for Postgres and Redis to come up.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: php-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pest:
    name: Pest
    runs-on: ubuntu-latest

    services:
      # Matching the local DDEV versions. A test suite that passes here and fails on a
      # different major is a bad trade for a slightly newer image.
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: syoksheet_primary_testing
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      rustfs:
        image: rustfs/rustfs:1.0.0-rc.5
        env:
          RUSTFS_ACCESS_KEY: rustfsadmin
          RUSTFS_SECRET_KEY: rustfsadmin
          RUSTFS_VOLUMES: /data
          RUSTFS_ADDRESS: ':9000'
        ports: ['9000:9000']
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:9000/health"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      AUDIT_DB_HOST: 127.0.0.1
      AUDIT_DB_PORT: 5432
      AUDIT_DB_USERNAME: postgres
      AUDIT_DB_PASSWORD: postgres
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      # .env.example points at the compose service name, which does not resolve here.
      # Dotenv is loaded immutably, so this wins, the same way DB_ and REDIS_ do.
      R2_ENDPOINT: http://127.0.0.1:9000

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-php

      # The service container creates one database from POSTGRES_DB. We run two: the
      # audit log is a separate database rather than a schema, because Postgres cannot
      # foreign-key across databases and that is what keeps audit references raw ids.
      # Mirrors .ddev/scripts/create-databases.sh.
      - name: Create the audit database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -c 'CREATE DATABASE syoksheet_audit_testing'

      # .env is created by the setup-php action, before composer install boots the app
      # and trips Domain::host(). The key needs vendor/, so it belongs here instead.
      - name: Generate the application key
        run: php artisan key:generate

      # Object storage is real here too, for the same reason as Redis below:
      # FilesystemDisksTest signs a URL and fetches it, expects a 403 on an unsigned
      # request, and reads a public object anonymously. A faked disk would answer yes to
      # all three regardless of configuration.
      - name: Create the buckets
        env:
          RUSTFS_ENDPOINT: http://127.0.0.1:9000
          AWS_ACCESS_KEY_ID: rustfsadmin
          AWS_SECRET_ACCESS_KEY: rustfsadmin
          AWS_DEFAULT_REGION: auto
        run: bash .ddev/scripts/create-buckets.sh

      # Redis is genuinely required despite the array cache and sync queue in
      # phpunit.xml: RedisConnectionTest opens a real connection. Without it, 4 tests fail.
      - name: Run tests
        run: php artisan test --compact
